<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <rect width="600" height="340" fill="#ece6e0"/>
  <!-- Editor de código -->
  <rect x="90" y="60" width="250" height="220" rx="6" fill="#2d2d2d"/>
  <g font-family="Consolas, monospace" font-size="15">
    <text x="112" y="100" fill="#d7ba7d">.tarjeta</text>
    <text x="186" y="100" fill="#d4d4d4">{</text>
    <text x="130" y="130" fill="#9cdcfe">display</text><text x="196" y="130" fill="#d4d4d4">: grid;</text>
    <text x="130" y="158" fill="#9cdcfe">gap</text><text x="160" y="158" fill="#d4d4d4">: 1.5rem;</text>
    <text x="130" y="186" fill="#9cdcfe">border</text><text x="184" y="186" fill="#d4d4d4">: 1px solid;</text>
    <text x="130" y="214" fill="#9cdcfe">padding</text><text x="196" y="214" fill="#d4d4d4">: 1rem;</text>
    <text x="112" y="244" fill="#d4d4d4">}</text>
  </g>
  <!-- Resultado del diseño -->
  <g fill="#ffffff" stroke="#cdbfb2">
    <rect x="370" y="60" width="140" height="100" rx="4"/>
    <rect x="370" y="180" width="64" height="100" rx="4"/>
    <rect x="446" y="180" width="64" height="100" rx="4"/>
  </g>
  <rect x="384" y="74" width="112" height="40" fill="#d9cfc5"/>
  <rect x="384" y="124" width="70" height="8" fill="#b9aa9b"/>
  <rect x="384" y="140" width="96" height="6" fill="#d9cfc5"/>
</svg>
